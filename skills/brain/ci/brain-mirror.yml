name: brain-mirror

# Keeps brain/plan (mirror of .paul/) and brain/tickets (mirror of GitHub issues)
# current, so Obsidian and agents see them. Bot-written; nobody edits the mirrors.
on:
  push:
    branches: [main]
    paths: [".paul/**"]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: brain-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/brain-mirror.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add brain/plan brain/tickets
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="brain-bot" -c user.email="brain-bot@users.noreply.github.com" \
            commit -m "chore(brain): refresh plan and tickets mirror [skip ci]"
          git push origin HEAD:main
