name: brain-sync

# Obsidian users edit the vault on a personal `brain/<name>` branch (Obsidian Git plugin
# auto-commits and pushes). This workflow merges those pushes into main automatically, but ONLY
# when every change is inside brain/ (and not in the generated mirrors), and fans main back out
# to every brain/* branch so everyone sees each other's notes.
on:
  push:
    branches: ["brain/**", main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: brain-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge-notes:
    if: startsWith(github.ref, 'refs/heads/brain/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only plain notes, from their owner, may auto-merge
        id: gate
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # Only the person named in the branch may auto-merge it: brain/<github-login>.
          if [ "$(echo "$BRANCH" | tr 'A-Z' 'a-z')" != "brain/$(echo "$ACTOR" | tr 'A-Z' 'a-z')" ]; then
            echo "::error::Auto-merge only for your own branch brain/$ACTOR (pushed $BRANCH). Open a normal PR instead."; exit 1
          fi
          git fetch origin main
          # Gate exactly the commit that triggered this run (github.sha) — the merge below is pinned to it.
          base=$(git merge-base origin/main "$SHA")
          bad=""; n=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            case "$f" in
              brain/.obsidian/*|brain/index.md|brain/plan/*|brain/tickets/*) bad="$bad$f (protected: reviewed PR only)\n" ;;
              brain/*.md|brain/*.png|brain/*.jpg|brain/*.jpeg|brain/*.gif|brain/*.webp|brain/*.pdf) ;;
              *) bad="$bad$f (not a note or image under brain/)\n" ;;
            esac
          done < <(git diff -z --name-only --no-renames "$base" "$SHA")
          [ "$n" -eq 0 ] && { echo "nothing to merge"; echo "merge=no" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -n "$bad" ]; then
            echo "::error::These changes need a normal reviewed PR (Obsidian config, the brain hub that every session reads, generated mirrors, or files outside brain/):"
            printf '%b' "$bad"; exit 1
          fi
          if git diff "$base" "$SHA" | grep -qE '^\+.*(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_|sk_(live|test)_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|xox[abpors]-)'; then
            echo "::error::A note looks like it contains a secret. Remove it (store secrets in the password manager) and push again."; exit 1
          fi
          echo "merge=yes" >> "$GITHUB_OUTPUT"
      - name: Open or update PR and merge the checked commit
        if: steps.gate.outputs.merge == 'yes'
        env:
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" --title "brain: notes from $BRANCH" \
              --body "Automatic merge of Obsidian notes. Checked at $SHA: branch owner pushed it, only .md/images under brain/, nothing protected (.obsidian, index.md, mirrors), no secret patterns."
          fi
          # --match-head-commit: if anything was pushed after the check, the merge is refused.
          gh pr merge "$BRANCH" --merge --match-head-commit "$SHA"
      - name: Bring the branch up to date with main
        if: steps.gate.outputs.merge == 'yes'
        run: |
          git fetch origin main "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git -c user.name="brain-bot" -c user.email="brain-bot@users.noreply.github.com" merge --no-edit origin/main
          git push origin "$BRANCH"

  fan-out:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main into every brain/* branch
        run: |
          for b in $(git branch -r --format='%(refname:short)' | grep '^origin/brain/' | sed 's#^origin/##'); do
            git checkout -q -B "$b" "origin/$b"
            if git -c user.name="brain-bot" -c user.email="brain-bot@users.noreply.github.com" merge --no-edit origin/main; then
              git push -q origin "$b" || echo "::warning::push failed for $b"
            else
              git merge --abort
              echo "::warning::$b conflicts with main — next Claude session on that branch runs /harness:sync"
            fi
          done
